name: SonarCloud

# Corre las pruebas del frontend y del backend, genera la cobertura y la sube
# a SonarCloud. Necesita el secreto SONAR_TOKEN en
# Settings > Secrets and variables > Actions.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analisis:
    name: Pruebas y análisis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud necesita el historial completo

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Demo/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Demo/backend/requirements.txt

      - name: Pruebas del frontend (con cobertura)
        working-directory: Demo/frontend
        run: |
          npm ci
          mkdir -p coverage
          node --test --experimental-test-coverage \
            --test-coverage-include="src/**/*.ts" \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=lcov --test-reporter-destination=coverage/lcov.info \
            tests/auth.test.ts tests/proveedor_api.test.ts

      - name: Pruebas del backend (con cobertura)
        working-directory: Demo/backend
        run: |
          pip install -r requirements.txt coverage
          printf '[run]\nrelative_files = True\n' > .coveragerc
          python -m coverage run --branch --source=api,Model -m pruebas.prueba_acceso
          python -m coverage run --branch --append --source=api,Model pruebas/prueba_humo.py
          python -m coverage xml -o coverage.xml
          # SonarCloud cuenta las rutas desde la raíz del repositorio
          sed -i 's#filename="#filename="Demo/backend/#g' coverage.xml

      - name: Análisis de SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
